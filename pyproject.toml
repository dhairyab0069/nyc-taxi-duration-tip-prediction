[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taxi"
version = "0.1.0"
description = "Trip duration regression and tip classification on NYC taxi data"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14", "scikit-learn>=1.4", "lightgbm>=4.0", "torch>=2.3", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E731", "E501"]  # short lambdas and a few long lines in scripts
